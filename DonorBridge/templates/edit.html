{% extends "base.html" %}

{% block title %}Edit donor | DonorBridge{% endblock %}

{% block content %}
<section class="edit-page">
    <a class="back-link" href="{{ url_for('index') }}">&larr; Back to directory</a>
    <section class="panel edit-panel">
        <div class="panel-heading">
            <div>
                <p class="eyebrow">DONOR #{{ donor.id }}</p>
                <h1>Edit donor details</h1>
            </div>
        </div>
        {% if form_errors %}
            <div class="form-errors" role="alert">
                {% for error in form_errors %}<p>{{ error }}</p>{% endfor %}
            </div>
        {% endif %}
        <form action="{{ url_for('edit_donor', donor_id=donor.id) }}" method="post" class="donor-form">
            <label for="name">Donor name <span class="required">*</span></label>
            <input id="name" name="name" type="text" maxlength="100" required value="{{ donor.name }}">

            <label for="blood_group">Blood group <span class="required">*</span></label>
            <select id="blood_group" name="blood_group" required>
                {% for group in blood_groups %}
                    <option value="{{ group }}" {% if donor.blood_group == group %}selected{% endif %}>{{ group }}</option>
                {% endfor %}
            </select>

            <label for="city">City <span class="required">*</span></label>
            <input id="city" name="city" type="text" maxlength="100" required value="{{ donor.city }}">

            <label for="contact">Contact number <span class="required">*</span></label>
            <input id="contact" name="contact" type="tel" maxlength="20" required value="{{ donor.contact }}">

            <label for="availability">Availability <span class="required">*</span></label>
            <select id="availability" name="availability" required>
                <option value="true" {% if donor.availability %}selected{% endif %}>Available</option>
                <option value="false" {% if not donor.availability %}selected{% endif %}>Unavailable</option>
            </select>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Save changes</button>
                <a class="button button-light" href="{{ url_for('index') }}">Cancel</a>
            </div>
        </form>
    </section>
</section>
{% endblock %}
